name: PS3 / PSL1GHT Build

on:
  push:
    branches:
      - ps3-port
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ps3:
    name: Build DevilutionX for PS3
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: hldtux/ps3dev-sdl2:latest
    timeout-minutes: 90
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build gettext ccache python3 file binutils
          rm -rf /var/lib/apt/lists/*

      - name: Verify PS3 SDK and SDL2
        run: |
          set -euo pipefail
          test -x "$PS3DEV/ppu/bin/ppu-gcc"
          test -x "$PS3DEV/ppu/bin/ppu-g++"
          test -x "$PS3DEV/ppu/bin/ppu-objcopy"
          command -v sdl2-config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ppu-gcc --version | head -n 1
          ppu-g++ --version | head -n 1
          sdl2-config --version
          mkdir -p build-ps3
          {
            echo "PS3DEV=$PS3DEV"
            echo "SDL2=$(sdl2-config --version)"
            ppu-g++ --version | head -n 1
            sdl2-config --cflags
            sdl2-config --libs
          } | tee build-ps3/ps3-sdk-info.txt

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: devilutionx-ps3-ccache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            devilutionx-ps3-ccache-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            devilutionx-ps3-ccache-${{ runner.os }}-

      - name: Restore CMake/Ninja build tree
        id: ps3-build-cache
        uses: actions/cache@v4
        with:
          path: build-ps3
          key: devilutionx-ps3-build-v1-${{ runner.os }}-${{ hashFiles('CMake/ps3-psl1ght.cmake', 'CMake/Platform/PS3.cmake', 'CMake/platforms/ps3.cmake') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            devilutionx-ps3-build-v1-${{ runner.os }}-${{ hashFiles('CMake/ps3-psl1ght.cmake', 'CMake/Platform/PS3.cmake', 'CMake/platforms/ps3.cmake') }}-${{ github.head_ref || github.ref_name }}-
            devilutionx-ps3-build-v1-${{ runner.os }}-${{ hashFiles('CMake/ps3-psl1ght.cmake', 'CMake/Platform/PS3.cmake', 'CMake/platforms/ps3.cmake') }}-

      - name: Configure ccache and restore incremental timestamps
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=compiler_check=content
          ccache --max-size="$CCACHE_MAXSIZE"
          python3 Packaging/ps3/incremental.py prepare build-ps3
          ccache --show-stats

      - name: Configure and compile
        run: |
          set -euo pipefail
          if [[ "${{ steps.ps3-build-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "Exact commit cache restored; already-built PPU dependencies are reusable."
          else
            echo "No exact-SHA cache key; actions/cache may have restored the latest branch cache."
            echo "The incremental source-hash scan below determines which translation units need rebuilding."
          fi
          bash Packaging/ps3/build.sh --build-only build-ps3

      - name: Record source hashes, compiler statistics, and Lua diagnostics
        if: success()
        run: |
          set -euo pipefail
          python3 Packaging/ps3/incremental.py record build-ps3
          ccache --show-stats | tee build-ps3/ccache-stats.txt
          LDO="build-ps3/_deps/lua-src/lua-5.4.7/src/ldo.c"
          if [[ -f "$LDO" ]]; then
            sed -n '/int luaD_rawrunprotected/,/^}/p' "$LDO" \
              | tee build-ps3/lua-protected-call-source.txt
          else
            echo "Lua ldo.c not found at expected FetchContent path: $LDO" \
              | tee build-ps3/lua-protected-call-source.txt
          fi
          ninja -C build-ps3 -t commands \
            | grep -E 'ldo\.c.*(obj|o)( |$)' \
            | tee build-ps3/lua-ldo-compile-command.txt || true

      - name: Verify linked PPU ELF
        run: |
          set -euo pipefail
          test -s build-ps3/devilutionx
          file build-ps3/devilutionx | tee build-ps3/ppu-elf-info.txt
          file build-ps3/devilutionx | grep -Eiq 'ELF 64-bit MSB.*PowerPC'
          readelf -h build-ps3/devilutionx | tee -a build-ps3/ppu-elf-info.txt
          readelf -h build-ps3/devilutionx | grep -Eiq 'PowerPC64|PowerPC'
          readelf -SW build-ps3/devilutionx | tee -a build-ps3/ppu-elf-info.txt
          readelf -SW build-ps3/devilutionx | grep -Fq '.sys_proc_param' || {
            echo "PS3 process metadata section .sys_proc_param is missing" >&2
            exit 1
          }
          "$PS3DEV/ppu/bin/ppu-objcopy" --dump-section .sys_proc_param=build-ps3/sys_proc_param.bin build-ps3/devilutionx
          python3 - <<'PY'
          from pathlib import Path
          import struct

          section = Path("build-ps3/sys_proc_param.bin").read_bytes()
          if len(section) != 0x20:
              raise SystemExit(f"unexpected PS3 process metadata size: {len(section)} bytes")
          actual = struct.unpack(">8I", section)
          expected = (0x20, 0x13BCC5F6, 0x00009000, 0x00192001,
                      1001, 0x00100000, 0x00100000, 0)
          if actual != expected:
              raise SystemExit(
                  "invalid PS3 process metadata: "
                  f"{tuple(hex(value) for value in actual)}"
              )
          print("PS3 process metadata verified: priority=1001, stack=1 MiB")
          PY

      - name: Upload PPU ELF and built-in engine assets
        uses: actions/upload-artifact@v4
        with:
          name: devilutionx-ps3-ppu-elf
          path: |
            build-ps3/devilutionx
            build-ps3/assets/
            build-ps3/ps3-sdk-info.txt
            build-ps3/ppu-elf-info.txt
            build-ps3/ccache-stats.txt
            build-ps3/lua-protected-call-source.txt
            build-ps3/lua-ldo-compile-command.txt
          if-no-files-found: error
      
      - name: Create PS3 SELF and PKG
        run: |
          set -euo pipefail
          bash Packaging/ps3/make_pkg.sh build-ps3

      - name: Verify finalized GNPDRM PKG
        run: |
          set -euo pipefail
          PKG="build-ps3/devilutionx-ps3-gnpdrm.pkg"
          test -s "$PKG"
          python3 - "$PKG" <<'PY'
          from pathlib import Path
          import struct
          import sys

          path = Path(sys.argv[1])
          header = path.read_bytes()[:0x80]
          if len(header) < 0x80 or header[:4] != b"\x7fPKG":
              raise SystemExit("finalized package has an invalid PKG header")
          revision = struct.unpack(">H", header[4:6])[0]
          if revision != 0x8000:
              raise SystemExit(f"expected GNPDRM PKG revision 0x8000, got 0x{revision:04x}")
          print(f"Finalized GNPDRM package verified: {path} ({path.stat().st_size} bytes)")
          PY

      - name: Upload finalized GNPDRM PS3 PKG
        uses: actions/upload-artifact@v4
        with:
          name: devilutionx-ps3-gnpdrm-pkg
          path: build-ps3/devilutionx-ps3-gnpdrm.pkg
          if-no-files-found: error
